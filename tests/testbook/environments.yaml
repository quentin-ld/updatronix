schema: updatronix-testbook/environments/v1
updated: 2026-10-29
defaults:
  user: testbook
  password: testbook-local
  snapshot: testbook-base2
  base: wp-content/testbook-base
  reset_timeout: 600
orchestration:
  catalog: host_python3
  pyyaml: host_only
  wordpress: ddev_wp
  playwright: bin_harness_exec
  note: >-
    `bin/harness exec python3` has no PyYAML. Run the test book with host
    `python3`, WordPress with `ddev wp`, and Playwright with
    `bin/harness exec`. Do not add a container PyYAML dependency.
snapshots:
  single: testbook-base2
  multisite: testbook-ms
  refresh: python3 tests/testbook/seed-fixtures.py --refresh-snapshots
  protocol: seed fixtures -> sync wp-content/testbook-base -> ddev snapshot
sites:
  single:
    project: updatronix-test
    path: /home/quentin/_DDEV/updatronix-test
    url: https://updatronix-test.ddev.site
    multisite: false
  multisite:
    project: updatronix-ms
    path: /home/quentin/_DDEV/updatronix-ms
    url: https://updatronix-ms.ddev.site
    multisite: true
    snapshot: testbook-ms
