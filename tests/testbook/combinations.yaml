- id: COMBO-001
  kind: triple
  dimensions:
    pro.shield.safe_mode: false
    pro.version_lock.enabled: true
    update.item_state: locked_native
  why: The master switch is inside Shield; with Shield off, the lock must be inactive
    and the native update must still run.
- id: COMBO-002
  kind: triple
  dimensions:
    free.schedule.delay_value: 365
    pro.version_lock.enabled: true
    update.item_state: held
  why: A long hold and a lock must both wait; neither may bypass the other.
- id: COMBO-003
  kind: triple
  dimensions:
    pro.license.status: inactive
    pro.pass.enabled: true
    pro.planning.gate_result: pass_disabled
  why: The kill switch is on, but the license gate must fail closed before execution.
- id: COMBO-004
  kind: triple
  dimensions:
    multisite.scope: network_activated
    multisite.pass_scope: main_site_only
    role.kind: super_admin
  why: Network activation must not turn the pass into a network-wide runner.
- id: COMBO-005
  kind: triple
  dimensions:
    pro.version_lock.enabled: true
    pro.version_lock.manual_updates: true
    update.origin: manual
  why: The manual hard block must cover the admin routes and leave WP-CLI as the escape
    hatch.
- id: COMBO-006
  kind: triple
  dimensions:
    pro.version_lock.detection: composer_project
    pro.version_lock.manual_updates: false
    update.item_state: pending
  why: Automatic updates are locked; manual admin updates remain available unless
    the manual switch says otherwise.
- id: COMBO-007
  kind: triple
  dimensions:
    pro.shield.safe_mode: true
    pro.shield.incompatible_behavior: disable
    pro.shield.re_enable: true
    free.schedule.delay_value: 0
  why: An incompatible update must be blocked, its auto-update turned off, and re-enabled
    only after a passing release.
- id: COMBO-008
  kind: triple
  dimensions:
    pro.pass.enabled: true
    pro.pass.node_count: 2
    update.package: invalid_zip
    update.email: one
  why: One item failing must not duplicate execution, lose the pass summary, or suppress
    the healthy item's email.
