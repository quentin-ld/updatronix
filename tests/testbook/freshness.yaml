  updatronix_native_update_time_enabled: free.kill_switch.native_update_time
  updatronix_pro_update_engine_enabled: pro.pass.enabled
  updatronix_pro_update_pass_enabled: pro.pass.enabled

native_options:
  auto_update_core: wp.auto_update_core
  auto_update_plugins: wp.auto_update_plugins
  auto_update_themes: wp.auto_update_themes
